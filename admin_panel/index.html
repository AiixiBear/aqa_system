<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>匿名留言卡片生成器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<link rel="icon" type="image/x-icon" href="https://www.aiixi.cc/favicon.ico">
<style>
    @font-face {
        font-family: 'Huninn';
        src: url('https://www.aiixi.cc/fonts/Huninn-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }

    * { -webkit-tap-highlight-color: transparent; }

    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
        font-family: "Huninn", system-ui, -apple-system, "Noto Sans TC", sans-serif !important;
        min-height: 100dvh;
    }

    .title {
        color: #00ff99;
        text-shadow: 0 0 24px rgba(0, 255, 153, .25);
    }

    /* ---------- 卡片 ---------- */
    .card {
        border-radius: 24px;
        padding: 24px;
        width: 300px;
        height: 300px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        word-break: break-word;
        overflow: hidden;
        position: relative;
        flex-shrink: 0;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, .3);
        border: 1px solid rgba(255, 255, 255, .15);
        transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
        isolation: isolate;
    }

    .card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .45)),
            url('YOUR_CARD_IMAGE_URL_HERE');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: background-image .3s ease;
    }

    .card:hover {
        transform: translateY(-6px);
        border-color: rgba(255, 255, 255, .3);
        box-shadow: 0 12px 40px 0 rgba(59, 130, 246, .25);
    }

    .card:hover::before {
        background-image:
            linear-gradient(rgba(0, 0, 0, .4), rgba(0, 0, 0, .4)),
            url('YOUR_CARD_IMAGE_URL_HERE');
    }

    .msg-text {
        text-shadow: 2px 2px 5px rgba(0, 0, 0, .8), -1px -1px 3px rgba(0, 0, 0, .8);
        overflow-wrap: anywhere;
    }

    .shadow-sm-text { text-shadow: 2px 2px 5px rgba(0, 0, 0, .8) !important; }

    /* ---------- 卡片外層 / 資訊面板 ---------- */
    .card-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        transition: gap .2s ease;
    }

    .card-wrapper.is-hidden { display: none !important; }

    .info-panel {
        display: none;
        position: absolute;
        top: calc(100% + 12px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        flex-direction: column;
        gap: 8px;
        width: 300px;
        max-width: 340px;
        box-sizing: border-box;
        padding: 16px;
        border-radius: 20px;
        background: rgba(15, 23, 42, .72);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(239, 68, 68, .35);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, .35);
        color: #fff;
        font-size: 12px;
        line-height: 1.6;
        max-height: 50vh;
        overflow-y: auto;
        overscroll-behavior: contain;
    }

    .info-row {
        display: flex;
        gap: 6px;
        align-items: flex-start;
    }

    .info-label {
        flex: 0 0 auto;
        color: #94a3b8;
        font-weight: 600;
    }

    .info-value {
        flex: 1 1 auto;
        min-width: 0;
        word-break: break-word;
        overflow-wrap: anywhere;
    }

    .info-panel a {
        color: #60a5fa;
        text-decoration: underline;
        flex: 0 0 auto;
    }

    .info-panel a:hover { color: #93c5fd; }

    /* 只在支援 hover 的裝置上顯示 */
    @media (hover: hover) {
        .card-wrapper:hover .info-panel { display: flex; }
    }

    /* 「顯示隱藏內容」開啟時，面板改為常駐展開 */
    .show-hidden .card-wrapper { gap: 12px; }
    .show-hidden .info-panel {
        display: flex;
        position: relative;
        inset: auto;
        transform: none;
    }

    /* ---------- 按鈕 / 表單 ---------- */
    .download-btn {
        cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s;
    }

    .download-btn:hover:not(:disabled) {
        background-color: #3b82f6;
        border-color: transparent;
        color: #fff;
    }

    .download-btn:active:not(:disabled) { background-color: #2563eb; }
    .download-btn:disabled { opacity: .55; cursor: progress; }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
        outline: 2px solid #34d399;
        outline-offset: 2px;
    }

    .filter-input { min-width: 160px; }

    /* ---------- 狀態區 ---------- */
    .status-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 32px 24px;
        color: #cbd5e1;
        font-size: 14px;
        text-align: center;
    }

    .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .15);
        border-top-color: #34d399;
        animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        .card:hover { transform: none; }
    }
</style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

<header class="w-full max-w-5xl mb-6 flex items-center justify-between gap-4 flex-wrap">
    <h1 class="text-3xl font-bold title">匿名留言牆</h1>
    <div class="flex items-center gap-3">
        <span id="count" class="text-xs text-slate-400"></span>
        <button id="reload"
                class="px-3 py-1.5 text-xs rounded-lg bg-white/10 border border-white/20 hover:bg-white/20 transition-colors cursor-pointer">
            ⟳ 重新整理
        </button>
    </div>
</header>

<div id="filters" class="w-full max-w-5xl mb-4 flex flex-wrap gap-2 items-center justify-center">
    <input id="kw"   class="filter-input px-3 py-2 rounded-lg shadow-sm text-black text-sm" placeholder="關鍵字篩選（留言內容）" />
    <input id="ip"   class="filter-input px-3 py-2 rounded-lg shadow-sm text-black text-sm" placeholder="IP 篩選（部分匹配）" />
    <input id="tag"  class="filter-input px-3 py-2 rounded-lg shadow-sm text-black text-sm" placeholder="辨識碼 篩選（部分匹配）" />
    <input id="code" class="filter-input px-3 py-2 rounded-lg shadow-sm text-black text-sm" placeholder="留言專屬代碼 篩選（部分匹配）" />
    <button id="apply" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm transition-colors cursor-pointer">篩選</button>
    <button id="clear" class="px-4 py-2 bg-gray-300 hover:bg-gray-200 text-black rounded-lg text-sm transition-colors cursor-pointer">清除</button>
    <label class="flex items-center gap-2 text-white px-2 cursor-pointer select-none">
        <input type="checkbox" id="showHidden" class="h-4 w-4" />
        <span class="text-sm">顯示隱藏內容</span>
    </label>
</div>

<!-- 狀態列（讀取中／錯誤／未解鎖） -->
<div id="status" class="w-full max-w-5xl" role="status" aria-live="polite"></div>

<div id="list" class="w-full max-w-5xl flex flex-wrap justify-center gap-4"></div>

<p id="emptyState" class="hidden text-slate-400 text-center py-12 text-sm"></p>

<!-- 密碼輸入彈窗 -->
<div id="passwordModal"
     class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4"
     role="dialog" aria-modal="true" aria-labelledby="pwdTitle">
    <form id="pwdForm"
          class="bg-slate-900 border border-white/20 p-6 rounded-3xl shadow-2xl w-full max-w-sm flex flex-col gap-4">
        <h3 id="pwdTitle" class="text-lg font-bold text-emerald-400 text-center">後台管理驗證</h3>
        <p class="text-xs text-gray-300 text-center leading-relaxed">請輸入後台管理密碼以檢視留言牆：</p>
        <input type="password" id="modalPasswordInput" autocomplete="current-password"
               class="px-3 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-emerald-400 text-sm"
               placeholder="請輸入密碼..." />
        <p id="modalError" class="text-xs text-rose-400 text-center hidden"></p>
        <div class="flex gap-2 mt-1">
            <button type="button" id="modalCancelBtn"
                    class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-medium rounded-xl text-sm transition-colors cursor-pointer">
                取消
            </button>
            <button type="submit"
                    class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-sm transition-colors shadow-lg shadow-emerald-500/20 cursor-pointer">
                確認進入
            </button>
        </div>
    </form>
</div>

<script>
(() => {
    'use strict';

    /* ============ 設定 ============ */
    const WORKER_URL = 'WORKER_URL';
    const PWD_KEY    = 'admin_password';

    /* ============ DOM ============ */
    const $ = (id) => document.getElementById(id);

    const listEl      = $('list');
    const statusEl    = $('status');
    const emptyEl     = $('emptyState');
    const countEl     = $('count');
    const showHiddenEl = $('showHidden');

    const filterEls = {
        kw:   $('kw'),
        ip:   $('ip'),
        tag:  $('tag'),
        code: $('code'),
    };

    /* ============ State ============ */
    const state = {
        messages: [],
        cards: [],          // [{ el, item }]
        password: sessionStorage.getItem(PWD_KEY) || '',
    };

    /* ============ 工具 ============ */
    function getDynamicFontSize(text) {
        const s = String(text || '');
        const visualLength = Array.from(s).reduce(
            (acc, ch) => acc + (ch.charCodeAt(0) > 255 ? 1 : 0.5), 0
        );

        if (visualLength <= 8)  return { fontSize: '28px', lineHeight: '1.3' };
        if (visualLength <= 15) return { fontSize: '26px', lineHeight: '1.3' };
        if (visualLength <= 30) return { fontSize: '22px', lineHeight: '1.4' };
        if (visualLength <= 45) return { fontSize: '20px', lineHeight: '1.5' };
        if (visualLength <= 60) return { fontSize: '18px', lineHeight: '1.5' };
        if (visualLength <= 80) return { fontSize: '16px', lineHeight: '1.5' };
        return { fontSize: '14px', lineHeight: '1.6' };
    }

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    /* ============ 狀態列 ============ */
    function setStatus(kind, message) {
        statusEl.replaceChildren();

        if (kind === 'ready') {
            statusEl.hidden = true;
            return;
        }
        statusEl.hidden = false;

        const box = el('div', 'status-box');

        if (kind === 'loading') {
            box.appendChild(el('div', 'spinner'));
            box.appendChild(el('p', '', '讀取中…'));
        } else {
            box.appendChild(el('p', '', message || '發生錯誤'));

            const retry = el('button',
                'px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl text-sm transition-colors cursor-pointer',
                kind === 'locked' ? '輸入密碼' : '重新嘗試');
            retry.type = 'button';
            retry.addEventListener('click', loadMessages);
            box.appendChild(retry);
        }

        statusEl.appendChild(box);
    }

    /* ============ 密碼彈窗 ============ */
    function askPassword(errorMessage = '') {
        return new Promise((resolve) => {
            const modal  = $('passwordModal');
            const form   = $('pwdForm');
            const input  = $('modalPasswordInput');
            const errEl  = $('modalError');
            const cancel = $('modalCancelBtn');

            let settled = false;

            const cleanup = (result) => {
                if (settled) return;
                settled = true;
                form.removeEventListener('submit', onSubmit);
                document.removeEventListener('keydown', onKey);
                cancel.onclick = null;
                modal.classList.add('hidden');
                resolve(result);
            };

            const onSubmit = (e) => {
                e.preventDefault();
                const value = input.value.trim();
                if (!value) { input.focus(); return; }
                cleanup(value);
            };

            const onKey = (e) => {
                if (e.key === 'Escape') { e.preventDefault(); cleanup(null); }
            };

            errEl.textContent = errorMessage;
            errEl.classList.toggle('hidden', !errorMessage);

            input.value = '';
            modal.classList.remove('hidden');
            requestAnimationFrame(() => input.focus());

            form.addEventListener('submit', onSubmit);
            document.addEventListener('keydown', onKey);
            cancel.onclick = () => cleanup(null);
        });
    }

    /* ============ 資料載入 ============ */
    async function loadMessages() {
        setStatus('loading');
        listEl.replaceChildren();
        emptyEl.classList.add('hidden');

        let password = state.password;
        let isRetry = false;

        for (;;) {
            if (!password) {
                const entered = await askPassword(isRetry ? '密碼錯誤，請再試一次。' : '');
                if (entered === null) {
                    setStatus('locked', '需要管理密碼才能檢視留言牆。');
                    return;
                }
                password = entered;
            }

            let res;
            try {
                res = await fetch(WORKER_URL, {
                    headers: { 'X-Admin-Password': password },
                    cache: 'no-store',
                });
            } catch (err) {
                console.error(err);
                setStatus('error', '連線失敗，請檢查網路後重試。');
                return;
            }

            if (res.status === 401) {
                password = '';
                isRetry = true;
                sessionStorage.removeItem(PWD_KEY);
                continue;
            }

            if (!res.ok) {
                setStatus('error', `讀取失敗（HTTP ${res.status}）。`);
                return;
            }

            let data;
            try {
                data = await res.json();
            } catch (err) {
                console.error(err);
                setStatus('error', '資料格式異常，請稍後再試。');
                return;
            }

            state.password = password;
            sessionStorage.setItem(PWD_KEY, password);
            state.messages = Array.isArray(data) ? data.slice().reverse() : [];

            renderAll();
            setStatus('ready');
            return;
        }
    }

    /* ============ 卡片建立 ============ */
    function infoRow(label, value) {
        const row = el('div', 'info-row');
        row.append(
            el('span', 'info-label', `${label}:`),
            el('span', 'info-value', value)
        );
        return row;
    }

    function buildInfoPanel(item) {
        const panel = el('div', 'info-panel');

        panel.appendChild(infoRow('來源', `${item.country || '未知'}（${item.as_name || '未知'}）`));

        // IP 列（含查詢連結）
        const ipRow = el('div', 'info-row');
        ipRow.append(
            el('span', 'info-label', 'IP:'),
            el('span', 'info-value', item.ip || '未知')
        );
        if (item.ip) {
            const link = el('a', '', '查看');
            link.href = `https://ipinfo.io/${encodeURIComponent(item.ip)}`;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.setAttribute('data-html2canvas-ignore', '');
            ipRow.appendChild(link);
        }
        panel.appendChild(ipRow);

        panel.appendChild(infoRow('辨識碼', item.tag || '無'));
        panel.appendChild(infoRow('User-Agent', item.userAgent || '未知'));

        return panel;
    }

    function createCard(item, index) {
        const text = item.text || '';
        const fs = getDynamicFontSize(text);

        const wrapper = el('div', 'card-wrapper');
        wrapper.dataset.index = String(index);

        const card = el('div', 'card');

        // 留言本文
        const body = el('div', 'flex-1 flex items-center justify-center w-full');
        const msg = el('div', 'font-bold text-center px-2 tracking-wide msg-text', text);
        msg.style.fontSize = fs.fontSize;
        msg.style.lineHeight = fs.lineHeight;
        body.appendChild(msg);

        // 卡片底部資訊
        const footer = el('div', 'w-full text-center mt-3 flex flex-col gap-1.5');
        footer.append(
            el('div', 'text-sm font-medium tracking-wider shadow-sm-text', item.time || ''),
            el('div', 'text-xs uppercase tracking-widest scale-95 shadow-sm-text',
                `愛希匿名問答#${item.code || '這則留言代碼未知'}`)
        );

        // 下載按鈕
        const btn = el('button',
            'download-btn mt-3 w-full py-1.5 bg-white/10 border border-white/20 rounded-xl text-xs font-medium tracking-wide',
            '下載圖片卡片');
        btn.type = 'button';
        btn.setAttribute('data-html2canvas-ignore', '');
        btn.addEventListener('click', () => exportToImage(wrapper, item, btn));

        card.append(body, footer, btn);
        wrapper.append(card, buildInfoPanel(item));

        return wrapper;
    }

    /* ============ 渲染 ============ */
    function renderAll() {
        listEl.replaceChildren();
        state.cards = [];

        const fragment = document.createDocumentFragment();
        state.messages.forEach((item, index) => {
            const cardEl = createCard(item, index);
            fragment.appendChild(cardEl);
            state.cards.push({ el: cardEl, item });
        });

        listEl.appendChild(fragment);
        applyFilters();
    }

    function matchItem(item, f) {
        if (f.kw) {
            const hay = `${item.text || ''} ${item.time || ''}`.toLowerCase();
            if (!f.kw.split(/\s+/).every((k) => hay.includes(k))) return false;
        }
        if (f.ip && (!item.ip || item.ip.indexOf(f.ip) === -1)) return false;
        if (f.tag && (!item.tag || item.tag.toLowerCase().indexOf(f.tag) === -1)) return false;
        if (f.code && (!item.code || item.code.indexOf(f.code) === -1)) return false;
        return true;
    }

    function applyFilters() {
        const f = {
            kw:   filterEls.kw.value.trim().toLowerCase(),
            ip:   filterEls.ip.value.trim(),
            tag:  filterEls.tag.value.trim().toLowerCase(),
            code: filterEls.code.value.trim(),
        };

        const total = state.cards.length;
        let visible = 0;

        for (const { el: cardEl, item } of state.cards) {
            const ok = matchItem(item, f);
            cardEl.classList.toggle('is-hidden', !ok);
            if (ok) visible++;
        }

        // 統計文字
        countEl.textContent = total ? `顯示 ${visible} / ${total} 則` : '';

        // 空狀態
        if (total === 0) {
            emptyEl.textContent = '目前還沒有任何留言。';
            emptyEl.classList.remove('hidden');
        } else if (visible === 0) {
            emptyEl.textContent = '沒有符合條件的留言。';
            emptyEl.classList.remove('hidden');
        } else {
            emptyEl.classList.add('hidden');
        }
    }

    /* ============ 匯出圖片 ============ */
    async function exportToImage(wrapper, item, btn) {
        const originalLabel = btn.textContent;
        btn.disabled = true;
        btn.textContent = '產生中…';

        const panelExpanded = document.body.classList.contains('show-hidden');

        try {
            const canvas = await html2canvas(wrapper, {
                scale: 3,
                useCORS: true,
                logging: false,
                backgroundColor: null,
                onclone: (doc) => {
                    const clone = doc.querySelector(
                        `.card-wrapper[data-index="${wrapper.dataset.index}"]`
                    );
                    if (!clone) return;

                    const cloneCard = clone.querySelector('.card');
                    if (cloneCard) {
                        cloneCard.style.transform = 'none';
                        cloneCard.style.boxShadow = 'none';
                    }

                    const cloneBtn = clone.querySelector('.download-btn');
                    if (cloneBtn) cloneBtn.style.visibility = 'hidden';

                    if (panelExpanded) {
                        clone.querySelectorAll('.info-panel').forEach((p) => {
                            p.style.display = 'flex';
                        });
                    }
                },
            });

            const suffix = item.code
                ? `_${String(item.code).replace(/[^\w-]+/g, '')}`
                : '';

            const link = document.createElement('a');
            link.download = `匿名留言卡片${suffix}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (err) {
            console.error('下載失敗：', err);
            alert('圖片產生失敗，請稍後再試。');
        } finally {
            btn.disabled = false;
            btn.textContent = originalLabel;
        }
    }

    /* ============ 事件綁定 ============ */
    let filterTimer = null;
    const scheduleFilter = () => {
        clearTimeout(filterTimer);
        filterTimer = setTimeout(applyFilters, 250);
    };

    Object.values(filterEls).forEach((input) => {
        input.addEventListener('input', scheduleFilter);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                clearTimeout(filterTimer);
                applyFilters();
            }
        });
    });

    $('apply').addEventListener('click', applyFilters);

    $('clear').addEventListener('click', () => {
        Object.values(filterEls).forEach((input) => { input.value = ''; });
        applyFilters();
    });

    showHiddenEl.addEventListener('change', (e) => {
        document.body.classList.toggle('show-hidden', e.target.checked);
    });

    $('reload').addEventListener('click', loadMessages);

    /* ============ 啟動 ============ */
    loadMessages();
})();
</script>
</body>
</html>
